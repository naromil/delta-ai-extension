<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Δ Delta AI Expand</h1>
    </header>

    <div class="status">
      <div class="row">
        <span class="label">Provider</span>
        <span class="value" id="provider-label">—</span>
      </div>
      <div class="row">
        <span class="label">Model</span>
        <span class="value" id="model-label">—</span>
      </div>
      <div class="row">
        <span class="label">Shortcut</span>
        <span class="value" id="shortcut-label">—</span>
      </div>
    </div>

    <div class="hint">Select text on any page, then press the shortcut or right-click <strong>Expand…</strong></div>

    <button id="settings-btn">Settings</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
